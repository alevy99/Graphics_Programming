<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>D3.js - Atmospheric CO2</title>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>

</head>
<body>
  
  <h1>Andrei Levchenko</h1>

  <script>
    // CORS fix for Chrome
    // https://tinyurl.com/k4chnujx - can't load JSON error
    const url = "https://raw.githubusercontent.com/humphs078/programming_for_data_analysis_assignment_2/refs/heads/main/datasets/fused_datasets/json/long_term_fused_data.json";

    d3.json(url)
      .then(function (data) {
        console.log(data);        // make sure its downloaded correctly
        plotCO2Data(data);        // plot the data as a graph
      });

    // Plot function for CO2 data
    function plotCO2Data(data) {
      console.log("Starting to plot CO2 data...");

      // SVG size and margins
      const margin = { top: 50, right: 50, bottom: 50, left: 50 };
      const width  = 960 - margin.left - margin.right;
      const height = 520 - margin.top - margin.bottom;


      // Scales
      // x: years ago (oldest on the left, 0 = 2023 on the right)
      const xScale = d3.scaleLinear()
        .domain([d3.max(data, d => d.years_before_2023), 0])
        .range([0, width]);

      // console.log(xScale(400000));

      // y: CO2 in ppm
      const yScale = d3.scaleLinear()
        .domain([d3.min(data, d => d.co2_ppmv), d3.max(data, d => d.co2_ppmv)])
        .range([height, 0]);

      // Add svg element to the body
      const svg = d3.select("body")
        .append("svg")
        .attr("width",  width  + margin.left + margin.right)
        .attr("height", height + margin.top  + margin.bottom);

      // Add group for svg
      const g = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      
      // x-axis moved to the bottom
      g.append("g")
        .attr("class", "x-axis")
        .attr("transform", `translate(0,${height})`)
        .call(xAxis);

      // y-axis on the left (default position)
      g.append("g")
        .attr("class", "y-axis")
        .call(yAxis);   

      // Line: no fill, red stroke 
      g.append("path")
        .attr("d", line(data))
        .attr("fill", "none")
        .attr("stroke", "red")
        .attr("stroke-width", 2);

      // Labels
      g.append("text")                       // x-axis label
        .attr("class", "axis-label")
        .attr("x", width / 2)
        .attr("y", height + 50)
        .attr("text-anchor", "middle")
        .text("Years ago (before 2023)");

      g.append("text")                       // y-axis label
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2)
        .attr("y", -55)
        .attr("text-anchor", "middle")
        .text("CO2 concentration (ppm)");

      g.append("text")                       // chart title
        .attr("class", "chart-title")
        .attr("x", width / 2)
        .attr("y", -25)
        .attr("text-anchor", "middle")
        .text("Atmospheric CO2 over time");


        // y: Temp anomaly
      const yScaleTemp = d3.scaleLinear()
        .domain([d3.min(data, d => d.temp_anomaly), d3.max(data, d => d.temp_anomaly)])
        .nice()
        .range([height, 0]);

      const lineTemp = d3.line()
        .x(d => xScale(d.years_before_2023))
        .y(d => yScaleTemp(d.temp_anomaly));  

      g.append("path")
        .attr("d", lineTemp(data))
        .attr("fill", "none")
        .attr("stroke", "green")
        .attr("stroke-width", 2);


      const yAxisTemp = d3.axisRight(yScaleTemp).ticks(8);

      // y-axis on the left (default position)
      g.append("g")
        .attr("class", "y-axis-right")
        .call(yAxisTemp);   

      const yScaleMethane = d3.scaleLinear()
        .domain([d3.min(data, d => d.ch4_ppb), d3.max(data, d => d.ch4_ppb)])
        .nice()
        .range([height, 0]);

      // console.log(d3.min(data, d => d.temp_anomaly));
      // console.log(data[d3.minIndex(data, d => d.temp_anomaly)].years_before_2023);
      // console.log(d3.max(data, d => d.temp_anomaly));
      // console.log(data[d3.maxIndex(data, d => d.temp_anomaly)].years_before_2023);

      const lineMethane = d3.line()
        .x(d => xScale(d.years_before_2023))
        .y(d => yScaleMethane(d.ch4_ppb)); 
        
      g.append("path")
        .attr("d", lineMethane(data))
        .attr("fill", "none")
        .attr("stroke", "orange")
        .attr("stroke-width", 2);

      const yAxisMethane = d3.axisRight(yScaleMethane).ticks(8);
    }


  </script>
</body>
</html>
